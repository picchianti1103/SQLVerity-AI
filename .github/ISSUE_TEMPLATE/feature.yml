name: Feature request
description: Propose a scoped improvement to SQLVerity AI.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or governance problem, not only the desired implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Safety and governance boundaries
      description: Note effects on SQL safety, privacy, authorization, tenant isolation, cost, and audit.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
