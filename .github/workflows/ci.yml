name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        run: >-
          docker run --rm --volume "$PWD:/repo:ro"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source=/repo --no-banner --redact --exit-code=1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check apps packages tests

      - name: Type-check
        run: python -m mypy apps packages tests --no-incremental

      - name: Test
        run: python -m pytest -q -p no:cacheprovider

      - name: Audit core dependencies for known vulnerabilities
        run: python -m pip_audit .

      - name: Inventory installed dependency licenses
        run: python -m piplicenses --format=markdown --with-urls

      - name: Golden regression gate
        run: >-
          python -m packages.evaluation.sqlverity_evaluation.cli
          --dataset fixtures/questions/golden_v1.json
          --thresholds fixtures/questions/golden_thresholds_v1.json
          --baseline fixtures/questions/golden_baseline_v1.json

      - name: Build distribution artifacts
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build hardened runtime image
        run: docker build --build-arg SQLVERITY_EXTRAS=postgres --tag sqlverity:ci .

      - name: Start smoke-test container
        run: |
          bootstrap_key="$(openssl rand -hex 32)"
          echo "::add-mask::$bootstrap_key"
          echo "SQLVERITY_CI_BOOTSTRAP_KEY=$bootstrap_key" >> "$GITHUB_ENV"
          docker run --detach --name sqlverity-smoke \
            --read-only --tmpfs /tmp --volume sqlverity-smoke-data:/data \
            --publish 127.0.0.1:8000:8000 \
            --env SQLVERITY_BOOTSTRAP_API_KEY="$bootstrap_key" \
            --env SQLVERITY_CATALOG_PATH=/data/sqlverity_catalog.sqlite3 \
            --env SQLVERITY_USER_REQUESTS_PER_WINDOW=1000 \
            --env SQLVERITY_USER_MAX_CONCURRENT=50 \
            sqlverity:ci

      - name: Verify health, UI, authentication, and runtime boundaries
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/health >/dev/null
          curl --fail --silent http://127.0.0.1:8000/ui >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8000/v1/tenants)" = "401"
          curl --fail --silent \
            --header "Authorization: Bearer $SQLVERITY_CI_BOOTSTRAP_KEY" \
            http://127.0.0.1:8000/v1/tenants >/dev/null
          test "$(docker inspect --format '{{.Config.User}}' sqlverity-smoke)" = "sqlverity"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' sqlverity-smoke)" = "true"
          docker exec sqlverity-smoke sh -c \
            'test ! -e /app/tests && test ! -e /app/docs && test ! -e /app/README.md'

      - name: Run bounded container load profile
        run: >-
          docker exec
          --env SQLVERITY_LOAD_TEST_BEARER_TOKEN="$SQLVERITY_CI_BOOTSTRAP_KEY"
          sqlverity-smoke sqlverity-load-test
          --base-url http://127.0.0.1:8000
          --path /v1/system/capabilities
          --requests 200
          --concurrency 10
          --maximum-p95-ms 2000

      - name: Show container logs on failure
        if: failure()
        run: docker logs sqlverity-smoke

      - name: Remove smoke-test resources
        if: always()
        run: |
          docker rm --force sqlverity-smoke || true
          docker volume rm sqlverity-smoke-data || true
