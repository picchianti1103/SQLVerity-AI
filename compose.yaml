services:
  catalog-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${SQLVERITY_POSTGRES_DB:-sqlverity}
      POSTGRES_USER: ${SQLVERITY_POSTGRES_USER:-sqlverity}
      POSTGRES_PASSWORD: ${SQLVERITY_POSTGRES_PASSWORD:?Set SQLVERITY_POSTGRES_PASSWORD in .env}
      SQLVERITY_DEMO_DB_PASSWORD: ${SQLVERITY_DEMO_DB_PASSWORD:?Set SQLVERITY_DEMO_DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - sqlverity-postgres:/var/lib/postgresql/data
      - ./fixtures/demo/00-create-demo.sh:/docker-entrypoint-initdb.d/00-create-demo.sh:ro
      - ./fixtures/demo/postgresql.sql:/docker-entrypoint-initdb.d/10-demo.sql:ro
    restart: unless-stopped

  sqlverity:
    build:
      context: .
      args:
        SQLVERITY_EXTRAS: ${SQLVERITY_EXTRAS:-postgres,openai,identity,secrets,observability}
    init: true
    depends_on:
      catalog-db:
        condition: service_healthy
    ports:
      - "${SQLVERITY_PORT:-8000}:8000"
    environment:
      SQLVERITY_BOOTSTRAP_API_KEY: ${SQLVERITY_BOOTSTRAP_API_KEY:?Set SQLVERITY_BOOTSTRAP_API_KEY in .env}
      SQLVERITY_CATALOG_BACKEND: ${SQLVERITY_CATALOG_BACKEND:-postgresql}
      SQLVERITY_CATALOG_PATH: /data/sqlverity_catalog.sqlite3
      SQLVERITY_CATALOG_SECRET_REF: env://SQLVERITY_CATALOG_DB
      SQLVERITY_CATALOG_POOL_MIN_SIZE: ${SQLVERITY_CATALOG_POOL_MIN_SIZE:-1}
      SQLVERITY_CATALOG_POOL_MAX_SIZE: ${SQLVERITY_CATALOG_POOL_MAX_SIZE:-10}
      SQLVERITY_SECRET_BACKENDS: ${SQLVERITY_SECRET_BACKENDS:-environment}
      SQLVERITY_REQUIRE_PROVIDER_POLICY: ${SQLVERITY_REQUIRE_PROVIDER_POLICY:-true}
      SQLVERITY_PREFLIGHT_SIGNING_KEY: ${SQLVERITY_PREFLIGHT_SIGNING_KEY:?Set SQLVERITY_PREFLIGHT_SIGNING_KEY in .env}
      SQLVERITY_PREFLIGHT_TTL_SECONDS: ${SQLVERITY_PREFLIGHT_TTL_SECONDS:-300}
      SQLVERITY_RATE_WINDOW_SECONDS: ${SQLVERITY_RATE_WINDOW_SECONDS:-60}
      SQLVERITY_USER_REQUESTS_PER_WINDOW: ${SQLVERITY_USER_REQUESTS_PER_WINDOW:-60}
      SQLVERITY_USER_MAX_CONCURRENT: ${SQLVERITY_USER_MAX_CONCURRENT:-4}
      SQLVERITY_TENANT_REQUESTS_PER_WINDOW: ${SQLVERITY_TENANT_REQUESTS_PER_WINDOW:-300}
      SQLVERITY_TENANT_MAX_CONCURRENT: ${SQLVERITY_TENANT_MAX_CONCURRENT:-20}
      SQLVERITY_DATA_SOURCE_REQUESTS_PER_WINDOW: ${SQLVERITY_DATA_SOURCE_REQUESTS_PER_WINDOW:-120}
      SQLVERITY_DATA_SOURCE_MAX_CONCURRENT: ${SQLVERITY_DATA_SOURCE_MAX_CONCURRENT:-8}
      SQLVERITY_PROVIDER_HTTP_MAX_ATTEMPTS: ${SQLVERITY_PROVIDER_HTTP_MAX_ATTEMPTS:-3}
      SQLVERITY_PROVIDER_HTTP_RETRY_BASE_SECONDS: ${SQLVERITY_PROVIDER_HTTP_RETRY_BASE_SECONDS:-0.25}
      SQLVERITY_PROVIDER_CIRCUIT_FAILURE_THRESHOLD: ${SQLVERITY_PROVIDER_CIRCUIT_FAILURE_THRESHOLD:-5}
      SQLVERITY_PROVIDER_CIRCUIT_RECOVERY_SECONDS: ${SQLVERITY_PROVIDER_CIRCUIT_RECOVERY_SECONDS:-30}
      SQLVERITY_BACKGROUND_WORKER_ENABLED: ${SQLVERITY_BACKGROUND_WORKER_ENABLED:-true}
      SQLVERITY_BACKGROUND_WORKER_POLL_MILLISECONDS: ${SQLVERITY_BACKGROUND_WORKER_POLL_MILLISECONDS:-1000}
      SQLVERITY_BACKGROUND_JOB_LEASE_SECONDS: ${SQLVERITY_BACKGROUND_JOB_LEASE_SECONDS:-120}
      SQLVERITY_SEMANTIC_INFERENCE_BATCH_SIZE: ${SQLVERITY_SEMANTIC_INFERENCE_BATCH_SIZE:-50}
      SQLVERITY_OTEL_ENABLED: ${SQLVERITY_OTEL_ENABLED:-false}
      SQLVERITY_OTEL_TRACE_SAMPLE_RATIO: ${SQLVERITY_OTEL_TRACE_SAMPLE_RATIO:-0.1}
      SQLVERITY_OTEL_ALLOW_INSECURE: ${SQLVERITY_OTEL_ALLOW_INSECURE:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-sqlverity-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-}
      SQLVERITY_OIDC_ISSUER: ${SQLVERITY_OIDC_ISSUER:-}
      SQLVERITY_OIDC_AUDIENCE: ${SQLVERITY_OIDC_AUDIENCE:-}
      SQLVERITY_OIDC_JWKS_URL: ${SQLVERITY_OIDC_JWKS_URL:-}
      SQLVERITY_OIDC_TENANT_CLAIM: ${SQLVERITY_OIDC_TENANT_CLAIM:-sqlverity_tenant_id}
      SQLVERITY_OIDC_REQUIRE_MFA: ${SQLVERITY_OIDC_REQUIRE_MFA:-true}
      SQLVERITY_OIDC_REQUIRED_ACR: ${SQLVERITY_OIDC_REQUIRED_ACR:-}
      SQLVERITY_OIDC_AUTHORIZATION_ENDPOINT: ${SQLVERITY_OIDC_AUTHORIZATION_ENDPOINT:-}
      SQLVERITY_OIDC_TOKEN_ENDPOINT: ${SQLVERITY_OIDC_TOKEN_ENDPOINT:-}
      SQLVERITY_OIDC_CLIENT_ID: ${SQLVERITY_OIDC_CLIENT_ID:-}
      SQLVERITY_OIDC_CLIENT_SECRET: ${SQLVERITY_OIDC_CLIENT_SECRET:-}
      SQLVERITY_OIDC_REDIRECT_URI: ${SQLVERITY_OIDC_REDIRECT_URI:-}
      SQLVERITY_BROWSER_SESSION_SECRET: ${SQLVERITY_BROWSER_SESSION_SECRET:-}
      SQLVERITY_BROWSER_SECURE_COOKIES: ${SQLVERITY_BROWSER_SECURE_COOKIES:-true}
      SQLVERITY_CATALOG_DB: '{"host":"catalog-db","port":5432,"database":"${SQLVERITY_POSTGRES_DB:-sqlverity}","username":"${SQLVERITY_POSTGRES_USER:-sqlverity}","password":"${SQLVERITY_POSTGRES_PASSWORD}","sslmode":"disable"}'
      SQLVERITY_LLM_PROVIDER: ${SQLVERITY_LLM_PROVIDER:-}
      SQLVERITY_LLM_PROVIDERS: ${SQLVERITY_LLM_PROVIDERS:-}
      SQLVERITY_OLLAMA_MODEL: ${SQLVERITY_OLLAMA_MODEL:-}
      SQLVERITY_OLLAMA_BASE_URL: ${SQLVERITY_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      SQLVERITY_OLLAMA_ALLOW_REMOTE: ${SQLVERITY_OLLAMA_ALLOW_REMOTE:-false}
      SQLVERITY_OLLAMA_ALLOW_DOCKER_HOST: ${SQLVERITY_OLLAMA_ALLOW_DOCKER_HOST:-true}
      SQLVERITY_OLLAMA_API_KEY: ${SQLVERITY_OLLAMA_API_KEY:-}
      SQLVERITY_OLLAMA_TIMEOUT_SECONDS: ${SQLVERITY_OLLAMA_TIMEOUT_SECONDS:-60}
      SQLVERITY_OLLAMA_MAX_OUTPUT_TOKENS: ${SQLVERITY_OLLAMA_MAX_OUTPUT_TOKENS:-4096}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SQLVERITY_OPENAI_MODEL: ${SQLVERITY_OPENAI_MODEL:-}
      SQLVERITY_OPENAI_TIMEOUT_SECONDS: ${SQLVERITY_OPENAI_TIMEOUT_SECONDS:-60}
      SQLVERITY_OPENAI_MAX_RETRIES: ${SQLVERITY_OPENAI_MAX_RETRIES:-2}
      SQLVERITY_OPENAI_MAX_OUTPUT_TOKENS: ${SQLVERITY_OPENAI_MAX_OUTPUT_TOKENS:-4096}
      SQLVERITY_OPENAI_DATA_RESIDENCY: ${SQLVERITY_OPENAI_DATA_RESIDENCY:-unspecified}
      SQLVERITY_OPENAI_RETENTION_MODE: ${SQLVERITY_OPENAI_RETENTION_MODE:-provider_default}
      SQLVERITY_OPENAI_DEPLOYMENT_TYPE: ${SQLVERITY_OPENAI_DEPLOYMENT_TYPE:-external_cloud}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SQLVERITY_ANTHROPIC_MODEL: ${SQLVERITY_ANTHROPIC_MODEL:-}
      SQLVERITY_ANTHROPIC_TIMEOUT_SECONDS: ${SQLVERITY_ANTHROPIC_TIMEOUT_SECONDS:-60}
      SQLVERITY_ANTHROPIC_MAX_OUTPUT_TOKENS: ${SQLVERITY_ANTHROPIC_MAX_OUTPUT_TOKENS:-4096}
      SQLVERITY_ANTHROPIC_DATA_RESIDENCY: ${SQLVERITY_ANTHROPIC_DATA_RESIDENCY:-unspecified}
      SQLVERITY_ANTHROPIC_RETENTION_MODE: ${SQLVERITY_ANTHROPIC_RETENTION_MODE:-provider_default}
      SQLVERITY_ANTHROPIC_DEPLOYMENT_TYPE: ${SQLVERITY_ANTHROPIC_DEPLOYMENT_TYPE:-external_cloud}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SQLVERITY_GEMINI_MODEL: ${SQLVERITY_GEMINI_MODEL:-}
      SQLVERITY_GEMINI_TIMEOUT_SECONDS: ${SQLVERITY_GEMINI_TIMEOUT_SECONDS:-60}
      SQLVERITY_GEMINI_MAX_OUTPUT_TOKENS: ${SQLVERITY_GEMINI_MAX_OUTPUT_TOKENS:-4096}
      SQLVERITY_GEMINI_DATA_RESIDENCY: ${SQLVERITY_GEMINI_DATA_RESIDENCY:-unspecified}
      SQLVERITY_GEMINI_RETENTION_MODE: ${SQLVERITY_GEMINI_RETENTION_MODE:-provider_default}
      SQLVERITY_GEMINI_DEPLOYMENT_TYPE: ${SQLVERITY_GEMINI_DEPLOYMENT_TYPE:-external_cloud}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      SQLVERITY_KIMI_MODEL: ${SQLVERITY_KIMI_MODEL:-}
      SQLVERITY_KIMI_TIMEOUT_SECONDS: ${SQLVERITY_KIMI_TIMEOUT_SECONDS:-60}
      SQLVERITY_KIMI_MAX_OUTPUT_TOKENS: ${SQLVERITY_KIMI_MAX_OUTPUT_TOKENS:-4096}
      SQLVERITY_KIMI_DATA_RESIDENCY: ${SQLVERITY_KIMI_DATA_RESIDENCY:-unspecified}
      SQLVERITY_KIMI_RETENTION_MODE: ${SQLVERITY_KIMI_RETENTION_MODE:-provider_default}
      SQLVERITY_KIMI_DEPLOYMENT_TYPE: ${SQLVERITY_KIMI_DEPLOYMENT_TYPE:-external_cloud}
      SQLVERITY_OLLAMA_DATA_RESIDENCY: ${SQLVERITY_OLLAMA_DATA_RESIDENCY:-local}
      SQLVERITY_OLLAMA_RETENTION_MODE: ${SQLVERITY_OLLAMA_RETENTION_MODE:-local_runtime}
      SQLVERITY_OLLAMA_DEPLOYMENT_TYPE: ${SQLVERITY_OLLAMA_DEPLOYMENT_TYPE:-local_private}
      SQLVERITY_DEMO_DB: '{"host":"catalog-db","port":5432,"database":"sqlverity_demo","username":"sqlverity_demo_reader","password":"${SQLVERITY_DEMO_DB_PASSWORD}","sslmode":"disable"}'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - sqlverity-catalog:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  sqlverity-catalog:
  sqlverity-postgres:
